<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10162b"><title>Examens oefenen</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap');

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 30px}.stat,.card,.work{background:linear-gradient(145deg,#1a2540dd,#121a2ddd);border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:0 14px 40px #0002}.stat b{font:800 24px Manrope;display:block}.stat span{font-size:12px;color:var(--muted)}
.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:30px 0 14px}.sectionhead h2{font:800 22px Manrope;margin:0}.sectionhead p{color:var(--muted);margin:4px 0 0;font-size:13px}

<div class="card subject" style="--glow:#ff82b2"><div class="emoji">🏛️</div><h3>Geschiedenis</h3><p>Kies een hoofdstuk:</p><div class="chapter"><button class="secondary" onclick="begin('geschiedenis','H1')">H1 · Olympische Spelen</button><button class="secondary" onclick="begin('geschiedenis','H2')">H2 · Tijdvakken</button><button class="secondary" onclick="begin('geschiedenis','H3')">H3 · Griekse samenleving</button><button class="secondary" onclick="begin('geschiedenis','H4')">H4 · Griekse cultuur</button><button class="secondary" onclick="begin('geschiedenis','H5')">H5 · Politiek</button></div><p><button class="primary" onclick="begin('geschiedenis')">Start alles</button></p></div>
</div>

</section>

<div class="work"><div class="between"><div><div class="eyebrow" id="subjectLabel">GESCHIEDENIS</div><h2 style="font:800 24px Manrope;margin:6px 0" id="sessionTitle">Oefensessie</h2></div><span class="tag" id="typeLabel">Meerkeuze</span></div><div class="chapter" id="chapters"></div><div class="between" style="margin-top:18px"><span class="meta" id="counter">Vraag 1 / 10</span><span class="meta" id="answered">0 ingevuld</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="question"></div><div class="between"><button class="secondary" id="prev" onclick="move(-1)">← Vorige</button><div class="row"><button class="secondary" id="next" onclick="move(1)">Volgende →</button><button class="primary" id="finish" onclick="finish()">Klaar · Verbeter mijn werk</button></div></div><div id="result" class="hidden"></div></div></section>
<div class="foot">EXAMENS OEFENEN · Je antwoorden blijven op dit toestel bewaard.</div></div>

let subject='',chapterFilter='',items=[],answers={},idx=0,checked=false,score=0;
const $=id=>document.getElementById(id);
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function stats(){}
function begin(s,ch=''){subject=s;chapterFilter=ch;$('practice').classList.remove('hidden');startSession();$('practice').scrollIntoView({behavior:'smooth',block:'start'})}
function home(){$('practice').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function startSession(){let source=bank[subject].filter(q=>!chapterFilter||q[0].startsWith(chapterFilter));items=shuffle(source).slice(0,Math.min(12,source.length));answers={};idx=0;checked=false;$('result').classList.add('hidden');$('subjectLabel').textContent=subject.toUpperCase();$('sessionTitle').textContent=subject==='geschiedenis'?'Geschiedenis · oefenmix':'Wiskunde · oefenmix';$('chapters').innerHTML=[...new Set(items.map(x=>x[0]))].map(x=>'<span>'+x+'</span>').join('');render()}
function render(){let q=items[idx];$('counter').textContent='Vraag '+(idx+1)+' / '+items.length;$('answered').textContent=Object.keys(answers).length+' ingevuld';$('bar').style.width=(Object.keys(answers).length/items.length*100)+'%';$('typeLabel').textContent=({mc:'Meerkeuze',fill:'Invullen',tf:'Juist / fout',multi:'Meerdere antwoorden',order:'Volgorde'})[q[2]];$('prev').disabled=idx===0;$('next').disabled=idx===items.length-1||checked;$('finish').disabled=checked;
let body='<div class="meta">'+q[0]+'</div><div class="qtitle">'+q[1]+'</div>';
if(q[2]==='mc'||q[2]==='tf'){let opts=q[2]==='tf'?['Waar','Niet waar']:q[3];body+='<div class="answers">'+opts.map((o,i)=>'<button class="choice '+(answers[idx]===i?'sel':'')+'" '+(checked?'disabled':'')+' onclick="choose('+i+')">'+o+'</button>').join('')+'</div>'}
if(q[2]==='multi'){body+='<div class="answers">'+q[3].map((o,i)=>'<button class="choice '+((answers[idx]||[]).includes(i)?'sel':'')+'" '+(checked?'disabled':'')+' onclick="toggle('+i+')">□ &nbsp;'+o+'</button>').join('')+'</div><div class="tiny">Duid alle juiste antwoorden aan.</div>'}
if(q[2]==='fill'){body+='<input class="answer" id="fill" placeholder="Typ je antwoord..." value="'+(answers[idx]||'')+'" '+(checked?'disabled':'')+' oninput="answers[idx]=this.value">';if(subject==='wiskunde')body+=keypad()}
if(q[2]==='order'){let val=answers[idx]||q[3].join('|');body+='<div class="answers">'+val.split('|').map((o,i)=>'<div class="choice" style="display:flex;justify-content:space-between;align-items:center">'+o+' <span><button class="secondary" onclick="swap('+i+',-1)">↑</button> <button class="secondary" onclick="swap('+i+',1)">↓</button></span></div>').join('')+'</div><div class="tiny">Gebruik de pijlen om de volgorde te veranderen.</div>'}
if(subject==='wiskunde'&&!checked)body+='<div class="tiny" style="margin-top:18px">✎ Tekenhulp voor meetkunde</div><canvas class="draw" id="canvas" width="640" height="240"></canvas><button class="ghost" onclick="clearDraw()">Wis tekening</button>';
if(checked){let ok=isCorrect(q,answers[idx]);body+='<div class="feedback '+(ok?'good':'bad')+'"><b>'+(ok?'Goed gedaan!':'Nog niet juist.')+'</b><br>Correct antwoord: '+correctText(q)+'<br><br>'+q[q.length-1]+'</div>'}
$('question').innerHTML=body;if(subject==='wiskunde'&&!checked&&$('canvas'))setupCanvas()}
function keypad(){return '<div class="keypad">'+['7','8','9','÷','4','5','6','×','1','2','3','−','0',',','+','(',')','²','√','°','←','C'].map(k=>'<button onclick="key(\''+k+'\')">'+k+'</button>').join('')+'</div>'}
function key(k){let el=$('fill');let v=el.value;if(k==='C')v='';else if(k==='←')v=v.slice(0,-1);else v+=k;el.value=v;answers[idx]=v}
function choose(i){answers[idx]=i;render()}function toggle(i){let a=answers[idx]||[];answers[idx]=a.includes(i)?a.filter(x=>x!==i):[...a,i];render()}
function swap(i,d){let a=(answers[idx]||items[idx][3].join('|')).split('|'),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];answers[idx]=a.join('|');render()}
function norm(s){return String(s??'').toLowerCase().replace(/[\s°]/g,'').replace(',','.').replace('−','-')}
function isCorrect(q,a){if(q[2]==='mc')return a===q[4];if(q[2]==='tf')return (a===0?'Waar':'Niet waar')===q[3];if(q[2]==='multi')return JSON.stringify([...(a||[])].sort())===JSON.stringify([...q[4]].sort());if(q[2]==='fill')return norm(a)===norm(q[3]);if(q[2]==='order')return a===q[4];return false}
function correctText(q){if(q[2]==='mc')return q[3][q[4]];if(q[2]==='tf')return q[3];if(q[2]==='multi')return q[4].map(i=>q[3][i]).join(', ');if(q[2]==='fill')return q[3];return q[4].replaceAll('|',' → ')}
function move(d){idx=Math.max(0,Math.min(items.length-1,idx+d));render()}
function finish(){checked=true;score=items.filter((q,i)=>isCorrect(q,answers[i])).length;localStorage.done=(+(localStorage.done||0))+items.length;localStorage.correct=(+(localStorage.correct||0))+score;render();$('result').classList.remove('hidden');$('result').innerHTML='<div class="feedback good"><div class="resultbig">'+score+'/'+items.length+'</div><b>Jouw resultaat</b><p>'+Math.round(score/items.length*100)+'% juist. Bekijk de uitleg bij elke vraag en probeer daarna een nieuwe willekeurige reeks.</p><button class="primary" onclick="startSession()">Nog een reeks ↗</button> <button class="secondary" onclick="home()">Terug naar overzicht</button></div>';stats()}
function setupCanvas(){let c=$('canvas'),ctx=c.getContext('2d'),on=false;c.onpointerdown=e=>{on=true;let r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!on)return;let r=c.getBoundingClientRect();ctx.lineWidth=2;ctx.strokeStyle='#273c88';ctx.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);ctx.stroke()};c.onpointerup=()=>on=false}
function clearDraw(){let c=$('canvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
stats();
</script></body></html>
