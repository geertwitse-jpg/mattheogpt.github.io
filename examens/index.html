<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10162b"><title>Examens oefenen</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap');
:root{--bg:#0b1020;--panel:#151d33;--panel2:#1b2742;--line:#2a3654;--txt:#f4f6ff;--muted:#9ca9c7;--blue:#7c8cff;--cyan:#58d6d0;--pink:#ff82b2;--yellow:#ffd477;--green:#69d6a4;--red:#ff8290}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#26376b 0,transparent 35%),radial-gradient(ellipse at 100% 20%,#342452 0,transparent 30%),var(--bg);color:var(--txt);font:15px 'DM Sans',sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1120px;margin:auto;padding:24px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px;font:800 20px Manrope}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--pink));display:grid;place-items:center;font-size:21px;box-shadow:0 8px 28px #7c8cff55}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px}
.hero{padding:34px 0 24px;max-width:760px}.eyebrow{color:var(--cyan);font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:11px}.hero h1{font:800 clamp(34px,6vw,58px)/1.05 Manrope;margin:12px 0}.grad{background:linear-gradient(90deg,#a7b3ff,#6fe0d5,#ff9ac2);background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px;max-width:620px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 30px}.stat,.card,.work{background:linear-gradient(145deg,#1a2540dd,#121a2ddd);border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:0 14px 40px #0002}.stat b{font:800 24px Manrope;display:block}.stat span{font-size:12px;color:var(--muted)}
.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:30px 0 14px}.sectionhead h2{font:800 22px Manrope;margin:0}.sectionhead p{color:var(--muted);margin:4px 0 0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.subject{position:relative;overflow:hidden;min-height:190px;transition:.2s;cursor:pointer}.subject:hover{transform:translateY(-4px);border-color:#7486ff;box-shadow:0 18px 45px #5369ff22}.subject:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-40px;bottom:-60px;background:var(--glow);filter:blur(4px);opacity:.25}.emoji{font-size:28px}.subject h3{font:800 20px Manrope;margin:15px 0 5px}.subject p{color:var(--muted);font-size:13px;margin:0 0 16px}.tag{display:inline-block;background:#ffffff0d;border:1px solid var(--line);padding:6px 9px;border-radius:99px;font-size:11px;color:#c4cfff}
.primary{background:linear-gradient(110deg,#7284ff,#9b78ff);color:white;padding:12px 18px;border-radius:13px;font-weight:800;box-shadow:0 7px 22px #7486ff33;transition:.15s}.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}.secondary{background:#ffffff0c;border:1px solid var(--line);color:var(--txt);padding:11px 15px;border-radius:12px;font-weight:700}.ghost{background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px}.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.work{margin-top:18px;padding:clamp(18px,4vw,30px)}.progress{height:9px;border-radius:20px;background:#ffffff12;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));width:0;transition:.3s;border-radius:20px}
.qtitle{font:800 clamp(21px,3vw,29px)/1.25 Manrope;margin:18px 0}.meta{color:var(--muted);font-size:12px}.answers{display:grid;gap:10px;margin:18px 0}.choice{text-align:left;padding:14px 16px;background:#ffffff08;border:1px solid var(--line);border-radius:13px;color:var(--txt);transition:.15s}.choice:hover,.choice.sel{border-color:var(--blue);background:#778aff1c}.choice.correct{border-color:var(--green);background:#69d6a41a}.choice.incorrect{border-color:var(--red);background:#ff82901a}
.answer{width:100%;background:#0e162b;border:1px solid var(--line);border-radius:13px;padding:15px;color:white;outline:none}.answer:focus{border-color:var(--blue)}.feedback{margin:16px 0;padding:14px 16px;border-radius:13px;background:#ffffff0a;border:1px solid var(--line);color:var(--muted)}.feedback.good{border-color:#69d6a466;color:#b6f4d6}.feedback.bad{border-color:#ff829066;color:#ffc1c8}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:10px 0}.keypad button{background:#263452;color:white;border:1px solid #354565;border-radius:9px;padding:10px 3px}.draw{width:100%;max-width:640px;height:240px;background:#fff;border-radius:12px;touch-action:none;display:block;margin:10px 0}.tiny{font-size:12px;color:var(--muted)}.chapter{display:flex;gap:8px;flex-wrap:wrap}.chapter span{border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:11px;color:var(--muted)}
.resultbig{font:800 40px Manrope}.toast{color:var(--yellow);font-size:13px}.foot{margin-top:40px;color:#73809d;font-size:12px;text-align:center}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.stats{gap:8px}.stat{padding:13px}.shell{padding:16px 14px 45px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.top{margin-bottom:14px}.pill{display:none}.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:20px}}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><div class="logo">✦</div> EXAMENS OEFENEN</div></header>
<section id="home">
<div class="hero" style="min-height:65vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:auto">
<h1 style="font-size:clamp(38px,7vw,58px)">Examens oefenen</h1>
<button class="primary" style="font-size:18px;padding:16px 34px" onclick="showSubjects()">Vakken</button>
</div>
</section>
<section id="subjects" class="hidden">
<div class="between"><button class="ghost" onclick="showHome()">← Terug</button></div>
<div class="hero" style="padding:20px 0 12px"><h1 style="font-size:32px">Kies een vak</h1></div>
<div class="grid">
<div class="card subject" style="--glow:#7b8cff" onclick="showChapters('nederlands')"><div class="emoji">📚</div><h3>Nederlands</h3></div>
<div class="card subject" style="--glow:#58d6d0" onclick="showChapters('wiskunde')"><div class="emoji">📐</div><h3>Wiskunde</h3></div>
<div class="card subject" style="--glow:#ff82b2" onclick="showChapters('geschiedenis')"><div class="emoji">🏛️</div><h3>Geschiedenis</h3></div>
</div>
</section>
<section id="chapters" class="hidden">
<div class="between"><button class="ghost" onclick="showSubjects()">← Vakken</button></div>
<div class="hero" style="padding:20px 0 12px"><h1 id="chapterHeading" style="font-size:32px">Kies een onderdeel</h1></div>
<div id="chapterOptions" class="grid"></div>
</section>
>
