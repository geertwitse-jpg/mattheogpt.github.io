<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MattheoGPT</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #0f172a;
color: white;
display: flex;
height: 100vh;
justify-content: center;
align-items: center;
}

.container {
width: 100%;
max-width: 800px;
height: 90vh;
display: flex;
flex-direction: column;
background: #111827;
border-radius: 15px;
overflow: hidden;
box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.header {
padding: 15px;
background: #1f2937;
text-align: center;
font-size: 20px;
font-weight: bold;
}

.chat {
flex: 1;
padding: 15px;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 10px;
}

.msg {
padding: 10px 15px;
border-radius: 12px;
max-width: 70%;
line-height: 1.4;
}

.user {
align-self: flex-end;
background: #3b82f6;
}

.ai {
align-self: flex-start;
background: #374151;
}

.input-area {
display: flex;
padding: 10px;
background: #1f2937;
}

input {
flex: 1;
padding: 10px;
border: none;
border-radius: 8px;
outline: none;
}

button {
margin-left: 10px;
padding: 10px 15px;
border: none;
background: #3b82f6;
color: white;
border-radius: 8px;
cursor: pointer;
}

button:hover {
background: #2563eb;
}

.small {
font-size: 12px;
opacity: 0.7;
text-align: center;
padding: 5px;
}
</style>
</head>

<body>

<div class="container">
<div class="header">🤖 MattheoGPT</div>

<div class="chat" id="chat"></div>

<div class="input-area">
<input id="input" placeholder="Typ je vraag..." />
<button onclick="send()">Send</button>
</div>


<script>
const chat = document.getElementById("chat");

// 🔴 ZET HIER JE OPENAI API KEY
const API_KEY = "sk-e2863a3d0f07d79c63138316b87810b83c54d90e2d40af5a913ea62f626c5f28";

async function send() {
const input = document.getElementById("input");
const text = input.value.trim();
if (!text) return;

addMessage(text, "user");
input.value = "";

addMessage("Thinking...", "ai", true);

try {
const res = await fetch("https://api.openai.com/v1/chat/completions", {
method: "POST",
headers: {
"Content-Type": "application/json",
"Authorization": "Bearer " + API_KEY
},
body: JSON.stringify({
model: "gpt-4o-mini",
messages: [
{
role: "system",
content: "Je bent MattheoGPT, een vriendelijke AI die alleen tekst antwoorden geeft."
},
{
role: "user",
content: text
}
]
})
});

const data = await res.json();

removeLastAI();
const reply = data.choices?.[0]?.message?.content || "Error";
addMessage(reply, "ai");

} catch (err) {
removeLastAI();
addMessage("Fout bij verbinden met AI", "ai");
}
}

function addMessage(text, type, temp = false) {
const div = document.createElement("div");
div.className = "msg " + type;
div.innerText = text;
if (temp) div.id = "temp";
chat.appendChild(div);
chat.scrollTop = chat.scrollHeight;
}

function removeLastAI() {
const temp = document.getElementById("temp");
if (temp) temp.remove();
}
</script>

</body>
</html>
